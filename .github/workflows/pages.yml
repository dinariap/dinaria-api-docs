name: Deploy API docs

on:
  push:
    branches:
      - main
      - docs/payouts-update
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: ${{ github.workspace }}/.gems
    steps:
      - name: Checkout main (production docs)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-main

      - name: Checkout v2 preview branch
        uses: actions/checkout@v4
        with:
          ref: docs/payouts-update
          path: site-v2

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false
          working-directory: site-main

      - name: Install gems
        working-directory: site-main
        run: bundle install --jobs 4 --retry 3

      - name: Build main site (/)
        working-directory: site-main
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: dinariap/dinaria-api-docs
        run: |
          rm -rf vendor
          bundle exec jekyll build --destination "${{ github.workspace }}/dist" --baseurl "/dinaria-api-docs"

      - name: Build v2 preview (/v2/)
        working-directory: site-v2
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: dinariap/dinaria-api-docs
          BUNDLE_GEMFILE: ${{ github.workspace }}/site-main/Gemfile
        run: |
          rm -rf vendor
          bundle exec jekyll build --destination "${{ github.workspace }}/dist/v2" --baseurl "/dinaria-api-docs/v2"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
