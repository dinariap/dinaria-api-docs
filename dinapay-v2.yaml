components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  headers:
    RequestId:
      description: Correlation identifier returned by Dinapay for tracing and support.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key for safely retrying this request. Reuse with a different body returns a conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    WebhookSubscriptionId:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookId:
      name: X-Webhook-Id
      in: header
      required: true
      description: Equal to eventId in the request body.
      schema:
        type: string
        format: uuid
    WebhookTimestamp:
      name: X-Webhook-Timestamp
      in: header
      required: true
      description: Unix timestamp in seconds used to compute the signature.
      schema:
        type: integer
        format: int64
    WebhookSignature:
      name: X-Webhook-Signature
      in: header
      required: true
      description: 't=<unix-seconds>,v1=<lowercase-hex-hmac-sha256>. Signed bytes: <timestamp>.<raw-request-body>.'
      schema:
        type: string
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RefundId:
      name: refundId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PayoutId:
      name: payoutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VirtualAccountId:
      name: virtualAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MerchantIdQuery:
      name: merchantId
      in: query
      description: Required only when account-level credentials can access more than one merchant.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  schemas:
    WebhookEventType:
      type: string
      enum:
      - payment.created
      - payment.status_changed
      - refund.created
      - refund.status_changed
      - payout.created
      - payout.status_changed
      - virtual_account.created
      - virtual_account.status_changed
    CreateWebhookSubscription:
      type: object
      additionalProperties: false
      required:
      - url
      properties:
        url:
          type: string
          format: uri
        eventTypes:
          type: array
          uniqueItems: true
          items:
            "$ref": "#/components/schemas/WebhookEventType"
    UpdateWebhookSubscription:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        url:
          type: string
          format: uri
        eventTypes:
          type: array
          uniqueItems: true
          items:
            "$ref": "#/components/schemas/WebhookEventType"
          description: An empty array removes the filter and subscribes to all V2 events.
    WebhookSubscription:
      type: object
      additionalProperties: false
      required:
      - webhookId
      - url
      - apiVersion
      - scope
      - creationDate
      - updatedDate
      properties:
        webhookId:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        apiVersion:
          type: string
          const: '2'
        scope:
          type: string
          enum:
          - account
          - merchant
        eventTypes:
          type: array
          uniqueItems: true
          items:
            "$ref": "#/components/schemas/WebhookEventType"
        creationDate:
          type: string
          format: date-time
        updatedDate:
          type: string
          format: date-time
        webhookSecret:
          type: string
          writeOnly: true
          description: Returned only at creation and rotation.
    WebhookSubscriptionWithSecret:
      allOf:
      - "$ref": "#/components/schemas/WebhookSubscription"
      - type: object
        required:
        - webhookSecret
        properties:
          webhookSecret:
            type: string
            writeOnly: true
    CreatePaymentRequest:
      type: object
      description: Provider-neutral payment order. Additional customer fields may be required according to payment method, country and risk policy.
      additionalProperties: false
      required:
      - externalId
      - amount
      - currency
      - paymentMethod
      - customer
      properties:
        merchantId:
          type: string
          description: Required only with account-scoped credentials when the merchant cannot be inferred.
        externalId:
          type: string
          minLength: 1
          maxLength: 255
          description: Stable order identifier assigned by the API consumer.
        amount:
          "$ref": "#/components/schemas/DecimalAmount"
        currency:
          type: string
          pattern: "^[A-Z]{3,8}$"
        paymentMethod:
          type: string
          minLength: 1
        rail:
          type: string
          description: Optional requested payment rail. The router may infer it when the selected connector has a single compatible rail.
        destinationMode:
          type: string
          enum:
          - single_use
          - reusable
          description: Optional requested destination lifecycle. The router may infer it when only one compatible mode exists.
        collectionKey:
          type: string
          minLength: 1
          maxLength: 255
          description: Opaque merchant-defined key for a stable collection relationship. It is not a bank account or identity document. Whether it is required is determined by the active country, rail and destination-mode policy.
        description:
          type: string
          maxLength: 256
        customer:
          "$ref": "#/components/schemas/Customer"
        successUrl:
          type: string
          format: uri
        cancelUrl:
          type: string
          format: uri
        expirationDate:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
      example:
        externalId: ORDER-1001
        amount: '0.25'
        currency: USDT
        paymentMethod: crypto_payment
        description: Super Test
        successUrl: https://merchant.example/success
        cancelUrl: https://merchant.example/cancel
        customer:
          type: individual
          externalId: customer-123
          firstName: Sebastian
          lastName: Gonzalez
          email: sebastian@example.com
          country: UY
        metadata:
          orderId: ORDER-1001
    Payment:
      type: object
      description: Current public payment state and the action required from the payer.
      additionalProperties: false
      required:
      - transactionId
      - externalId
      - status
      - amount
      - currency
      - paymentMethod
      - creationDate
      properties:
        transactionId:
          type: string
          format: uuid
        externalId:
          type: string
        status:
          "$ref": "#/components/schemas/PaymentStatus"
        amount:
          "$ref": "#/components/schemas/DecimalAmount"
        currency:
          type: string
        paymentMethod:
          type: string
        collectionKey:
          type: string
          description: Merchant-defined collection key applied to this payment when supplied.
        virtualAccountId:
          type: string
          format: uuid
          description: Present when this payment records funds received through a persistent virtual account.
        payer:
          "$ref": "#/components/schemas/Payer"
        description:
          type: string
        creationDate:
          type: string
          format: date-time
        expirationDate:
          type: string
          format: date-time
        actionUrl:
          type: string
          format: uri
          description: Provider-neutral Dinaria checkout URL and default completion mechanism.
        customer:
          "$ref": "#/components/schemas/Customer"
        metadata:
          type: object
          additionalProperties: true
        refundedAmount:
          "$ref": "#/components/schemas/DecimalAmount"
        refundedDate:
          type: string
          format: date-time
          description: Date of the first successful refund. Individual refund dates live on each refund resource.
        paymentData:
          "$ref": "#/components/schemas/PaymentData"
      example:
        transactionId: '04058d70-7d15-4459-b046-d19b6f137c37'
        externalId: ORDER-1001
        status: started
        amount: '0.25'
        currency: USDT
        paymentMethod: crypto_payment
        description: Super Test
        creationDate: '2026-09-09T18:30:00Z'
        expirationDate: '2026-09-09T19:30:00Z'
        actionUrl: https://pay.sand.dinaria.com/checkout/cs_public_token
        customer:
          type: individual
          externalId: customer-123
          firstName: Sebastian
          lastName: Gonzalez
          email: sebastian@example.com
          country: UY
        metadata:
          orderId: ORDER-1001
        paymentData:
          type: redirect
          redirect:
            recommendedAlternative: universal
            links:
              universal: https://app.binance.com/qr/example
              app: bnc://app.binance.com/payment/example
