---
openapi: 3.1.0
info:
  title: Dinapay API
  version: 2.0.0
  description: Receive funds from customers, return full or partial payments, and send funds to beneficiaries through one API. Dinaria manages provider selection, routing, and connector details transparently.
servers:
- url: https://api.sandbox.dinaria.com
  description: Sandbox
- url: https://api.dinaria.com
  description: Production
tags:
- name: Payments
  description: Receive funds from customers through supported payment methods and currencies.
- name: Refunds
  description: Return all or part of a payment and track the result independently.
- name: Payouts
  description: Send funds from an available balance to beneficiaries through supported local rails.
webhooks:
  merchantEvent:
    post:
      operationId: receiveDinariaWebhookV2
      summary: Payment or refund lifecycle event
      description: Signed at-least-once delivery. Events may be duplicated or arrive out of order; deduplicate by eventId and retain the greatest resourceVersion.
      security: []
      parameters:
      - "$ref": "#/components/parameters/WebhookId"
      - "$ref": "#/components/parameters/WebhookTimestamp"
      - "$ref": "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/WebhookEvent"
      responses:
        '200':
          description: Event accepted
        '204':
          description: Event accepted without a response body
  payoutEvent:
    post:
      summary: Payout lifecycle event
      description: Dinaria sends payout.created after durable creation and payout.status_changed after a public status transition. Deliveries are at least once and may arrive out of order.
      parameters:
      - "$ref": "#/components/parameters/WebhookId"
      - "$ref": "#/components/parameters/WebhookTimestamp"
      - "$ref": "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PayoutWebhookEvent"
      responses:
        '200':
          description: Event acknowledged. Any HTTP 2xx response acknowledges delivery.
paths:
  "/v2/payments":
    get:
      operationId: listPaymentsV2
      summary: List payments
      description: Returns payments visible to the authenticated principal in reverse chronological order. Use nextCursor to continue when hasMore is true.
      tags:
      - Payments
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Payments visible to the authenticated principal, ordered as one history
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PaymentPage"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
    post:
      operationId: createPaymentV2
      summary: Create a payment
      description: Receive funds by creating a payment order. The response provides a standard actionUrl and structured paymentData with the instructions needed by the payer.
      tags:
      - Payments
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The fields shown in the examples are for demonstration purposes and may vary depending on the use case.
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreatePaymentRequest"
            examples:
              argentina_cuit:
                summary: Argentina — bank transfer, CUIT customer
                value:
                  externalId: ORD-AR-1001
                  amount: "1500.00"
                  currency: ARS
                  paymentMethod: bank_transfer
                  customer:
                    type: individual
                    externalId: customer-ar-1001
                    firstName: Ana
                    lastName: Martínez
                    country: AR
                    documentType: CUIT
                    documentNumber: "20221370075"
                    documentCountry: AR
                  metadata: { orderId: ORD-AR-1001 }
              argentina_dni:
                summary: Argentina — bank transfer, DNI customer
                value:
                  externalId: ORD-AR-1002
                  amount: "500.00"
                  currency: ARS
                  paymentMethod: bank_transfer
                  customer:
                    type: individual
                    externalId: customer-ar-1002
                    firstName: María
                    lastName: López
                    country: AR
                    documentType: DNI
                    documentNumber: "22137007"
                    documentCountry: AR
              brazil_cpf:
                summary: Brazil — bank transfer, CPF customer
                value:
                  externalId: ORD-BR-2001
                  amount: "100.00"
                  currency: BRL
                  paymentMethod: instant_bank_transfer
                  customer:
                    type: individual
                    externalId: customer-br-2001
                    firstName: João
                    lastName: Silva
                    country: BR
                    documentType: CPF
                    documentNumber: "12345678901"
                    documentCountry: BR
                  metadata: { orderId: ORD-BR-2001 }
              brazil_cnpj:
                summary: Brazil — bank transfer, CNPJ customer
                value:
                  externalId: ORD-BR-2002
                  amount: "250.00"
                  currency: BRL
                  paymentMethod: instant_bank_transfer
                  customer:
                    type: business
                    externalId: company-br-2002
                    legalName: Belo Brasil Ltda
                    country: BR
                    documentType: CNPJ
                    documentNumber: "58084921000160"
                    documentCountry: BR
              brazil_pix_qr:
                summary: Brazil — dynamic PIX QR
                value:
                  externalId: ORD-BR-2003
                  amount: "100.00"
                  currency: BRL
                  paymentMethod: pix_qr
                  customer:
                    type: business
                    externalId: company-br-2003
                    legalName: Belo Brasil Ltda
                    country: BR
                    documentType: CNPJ
                    documentNumber: "58084921000160"
                    documentCountry: BR
                  metadata: { orderId: ORD-BR-2003 }
              binance_pay:
                summary: USDT — Binance Pay
                value:
                  externalId: ORDER-1001
                  amount: "0.25"
                  currency: USDT
                  paymentMethod: crypto_payment
                  description: Super Test
                  successUrl: https://merchant.example.com/payments/success
                  cancelUrl: https://merchant.example.com/payments/cancel
                  customer:
                    type: individual
                    externalId: customer-123
                    firstName: Sebastian
                    lastName: Gonzalez
                    email: sebastian@example.com
                    country: UY
                  metadata: { orderId: ORDER-1001 }
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Payment"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/Unprocessable"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/v2/payments/{transactionId}":
    get:
      operationId: getPaymentV2
      summary: Retrieve a payment
      description: Returns the latest public payment representation.
      tags:
      - Payments
      parameters:
      - "$ref": "#/components/parameters/TransactionId"
      responses:
        '200':
          description: Current payment representation
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Payment"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/v2/payments/{transactionId}/refunds":
    post:
      operationId: createPaymentRefundV2
      summary: Create a payment refund
      description: Creates a full or partial refund. A successful HTTP response means the refund was durably accepted; inspect its status for the final result.
      tags:
      - Refunds
      parameters:
      - "$ref": "#/components/parameters/TransactionId"
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateRefundRequest"
      responses:
        '200':
          description: No new refund was created. This is an idempotent replay of a previously accepted request with the same Idempotency-Key and identical body. The response returns the original Refund resource and includes Idempotent-Replayed true.
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
                const: true
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Refund"
        '201':
          description: A new refund was created and durably accepted for asynchronous processing. This does not mean the refund has completed; inspect its status for the final result.
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Refund"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/Unprocessable"
        '503':
          "$ref": "#/components/responses/Unavailable"
    get:
      operationId: listPaymentRefundsV2
      summary: List payment refunds
      description: Returns all refund attempts associated with the payment.
      tags:
      - Refunds
      parameters:
      - "$ref": "#/components/parameters/TransactionId"
      responses:
        '200':
          description: Refunds for the payment
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RefundList"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/v2/refunds/{refundId}":
    get:
      operationId: getRefundV2
      summary: Retrieve a refund
      description: Returns the latest public refund representation.
      tags:
      - Refunds
      parameters:
      - "$ref": "#/components/parameters/RefundId"
      responses:
        '200':
          description: Current refund representation
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Refund"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/v2/payouts":
    post:
      operationId: createPayoutV2
      summary: Create a payout
      description: Send funds from the available balance to a beneficiary through a supported destination and rail. The transfer is durably accepted for asynchronous processing. Idempotency-Key identifies the technical request; externalId identifies the payout in the client's system.
      tags:
      - Payouts
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        description: The fields shown in the examples are for demonstration purposes and may vary depending on the use case.
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreatePayout"
            examples:
              venezuela_bank_account:
                summary: Venezuela remittance — bank account
                value:
                  externalId: PAYOUT-VE-BANK-1001
                  source: { amount: "25.00", currency: USDT }
                  destination:
                    country: VE
                    currency: VES
                    beneficiary:
                      { type: individual, name: María González, documentType: RIF, documentNumber: V40001469 }
                    rail:
                      { type: ve_bank_account, bankCode: "0102", accountNumber: "01020305810000263562" }
                  remitter:
                    { type: individual, documentType: DNI, documentNumber: "30123456", firstName: Juan, lastName: Pérez }
              venezuela_mobile_payment:
                summary: Venezuela remittance — mobile payment
                value:
                  externalId: PAYOUT-VE-MOBILE-1001
                  source: { amount: "10.00", currency: USDT }
                  destination:
                    country: VE
                    currency: VES
                    beneficiary:
                      { type: individual, name: Wil Barragán, documentType: RIF, documentNumber: V27127416, mobile: "+584242005748" }
                    rail: { type: ve_mobile_payment, bankCode: "0175" }
                  remitter:
                    { type: individual, documentType: DNI, documentNumber: "30123456", firstName: Juan, lastName: Pérez }
              venezuela_cash_pickup:
                summary: Venezuela remittance — cash pickup
                value:
                  externalId: PAYOUT-VE-CASH-1001
                  source: { amount: "10.00", currency: USDT }
                  destination:
                    country: VE
                    currency: VES
                    beneficiary:
                      { type: individual, name: María González, documentType: RIF, documentNumber: V40001469 }
                    rail: { type: ve_cash_pickup }
                  remitter:
                    { type: individual, documentType: DNI, documentNumber: "30123456", firstName: Juan, lastName: Pérez }
              argentina_cbu:
                summary: Argentina — CBU
                value:
                  externalId: PAYOUT-AR-CBU-1001
                  source: { amount: "1500.00", currency: ARS }
                  destination:
                    country: AR
                    currency: ARS
                    beneficiary:
                      { type: individual, name: María González, documentType: CUIT, documentNumber: "27-12345678-5" }
                    rail: { type: ar_cbu, cbu: "0070327530004025541644" }
              argentina_cvu:
                summary: Argentina — CVU
                value:
                  externalId: PAYOUT-AR-CVU-1001
                  source: { amount: "1500.00", currency: ARS }
                  destination:
                    country: AR
                    currency: ARS
                    beneficiary:
                      { type: individual, name: María González, documentType: CUIT, documentNumber: "27-12345678-5" }
                    rail: { type: ar_cvu, cvu: "2850590940090418135201" }
              argentina_alias:
                summary: Argentina — alias
                value:
                  externalId: PAYOUT-AR-ALIAS-1001
                  source: { amount: "200.00", currency: ARS }
                  destination:
                    country: AR
                    currency: ARS
                    beneficiary:
                      { type: individual, name: María González, documentType: CUIT, documentNumber: "27-12345678-5" }
                    rail: { type: ar_alias, alias: mialias }
              brazil_pix_cpf:
                summary: Brazil — PIX CPF key
                value:
                  externalId: PAYOUT-BR-CPF-1001
                  source: { amount: "150.00", currency: BRL }
                  destination:
                    country: BR
                    currency: BRL
                    beneficiary:
                      { type: individual, name: João Silva, documentType: CPF, documentNumber: "12345678901" }
                    rail:
                      { type: br_pix, pixKey: { type: cpf, value: "12345678901" } }
              brazil_pix_evp:
                summary: Brazil — PIX random key (EVP)
                value:
                  externalId: PAYOUT-BR-EVP-1001
                  source: { amount: "75.50", currency: BRL }
                  destination:
                    country: BR
                    currency: BRL
                    beneficiary:
                      { type: individual, name: João Silva, documentType: CPF, documentNumber: "12345678901" }
                    rail:
                      { type: br_pix, pixKey: { type: evp, value: a1b2c3d4-e5f6-7890-abcd-ef1234567890 } }
      responses:
        '200':
          description: No new payout was created. This is an idempotent replay of a previously accepted request with the same Idempotency-Key and identical body. The response returns the original Payout resource and includes Idempotent-Replayed true.
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
                const: true
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Payout"
        '201':
          description: A new payout was created and durably accepted for asynchronous processing. This does not mean the beneficiary has received the funds; inspect its status for the final result.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Payout"
        '400':
          "$ref": "#/components/responses/PayoutBadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/Rejected"
        '503':
          "$ref": "#/components/responses/PayoutUnavailable"
    get:
      operationId: listPayoutsV2
      summary: List payouts
      description: Returns payouts visible to the authenticated principal in reverse chronological order. Use nextCursor to continue when hasMore is true.
      tags:
      - Payouts
      parameters:
      - name: status
        in: query
        schema:
          "$ref": "#/components/schemas/PayoutStatus"
      - name: externalId
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Payouts visible to the authenticated principal, ordered as one history
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PayoutPage"
        '400':
          "$ref": "#/components/responses/PayoutBadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/v2/payouts/{payoutId}":
    get:
      operationId: getPayoutV2
      summary: Retrieve a payout
      description: Returns the latest public representation. Use this endpoint to recover state after an ambiguous client timeout or a delayed webhook.
      tags:
      - Payouts
      parameters:
      - "$ref": "#/components/parameters/PayoutId"
      responses:
        '200':
          description: Canonical payout state
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Payout"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/PayoutNotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  headers:
    RequestId:
      description: Correlation identifier returned by Dinapay for tracing and support.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key for safely retrying this request. Reuse with a different body returns a conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    WebhookId:
      name: X-Webhook-Id
      in: header
      required: true
      description: Equal to eventId in the request body.
      schema:
        type: string
        format: uuid
    WebhookTimestamp:
      name: X-Webhook-Timestamp
      in: header
      required: true
      description: Unix timestamp in seconds used to compute the signature.
      schema:
        type: integer
        format: int64
    WebhookSignature:
      name: X-Webhook-Signature
      in: header
      required: true
      description: 't=<unix-seconds>,v1=<lowercase-hex-hmac-sha256>. Signed bytes: <timestamp>.<raw-request-body>.'
      schema:
        type: string
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RefundId:
      name: refundId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PayoutId:
      name: payoutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreatePaymentRequest:
      type: object
      description: Provider-neutral payment order. Additional customer fields may be required according to payment method, country and risk policy.
      additionalProperties: false
      required:
      - externalId
      - amount
      - currency
      - paymentMethod
      - customer
      properties:
        merchantId:
          type: string
          description: Required only with account-scoped credentials when the merchant cannot be inferred.
        externalId:
          type: string
          minLength: 1
          maxLength: 255
          description: Stable order identifier assigned by the API consumer.
        amount:
          "$ref": "#/components/schemas/DecimalAmount"
        currency:
          type: string
          pattern: "^[A-Z]{3,8}$"
        paymentMethod:
          type: string
          minLength: 1
        rail:
          type: string
          description: Optional requested processing rail within the selected paymentMethod. Omit it when Dinaria should infer the compatible rail. This request preference is different from paymentData.type and from the resolved rail that may appear in paymentData.bankTransfer.rail.
        destinationMode:
          type: string
          enum:
          - single_use
          - reusable
          description: Optional requested destination lifecycle. The router may infer it when only one compatible mode exists.
        description:
          type: string
          maxLength: 256
        customer:
          "$ref": "#/components/schemas/Customer"
        successUrl:
          type: string
          format: uri
        cancelUrl:
          type: string
          format: uri
        expirationDate:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
      example:
        externalId: ORDER-1001
        amount: '0.25'
        currency: USDT
        paymentMethod: crypto_payment
        description: Super Test
        successUrl: https://merchant.example/success
        cancelUrl: https://merchant.example/cancel
        customer:
          type: individual
          externalId: customer-123
          firstName: Sebastian
          lastName: Gonzalez
          email: sebastian@example.com
          country: UY
        metadata:
          orderId: ORDER-1001
    Payment:
      type: object
      description: Current public payment state and the action required from the payer.
      additionalProperties: false
      required:
      - transactionId
      - externalId
      - status
      - amount
      - currency
      - paymentMethod
      - creationDate
      - expirationDate
      - actionUrl
      - paymentData
      properties:
        transactionId:
          type: string
          format: uuid
        externalId:
          type: string
        status:
          "$ref": "#/components/schemas/PaymentStatus"
        amount:
          "$ref": "#/components/schemas/DecimalAmount"
        currency:
          type: string
        paymentMethod:
          type: string
        description:
          type: string
        creationDate:
          type: string
          format: date-time
        expirationDate:
          type: string
          format: date-time
        actionUrl:
          type: string
          format: uri
          description: Provider-neutral Dinaria checkout URL and default completion mechanism.
        customer:
          "$ref": "#/components/schemas/Customer"
        metadata:
          type: object
          additionalProperties: true
        refundedAmount:
          "$ref": "#/components/schemas/DecimalAmount"
        refundedDate:
          type: string
          format: date-time
          description: Date of the first successful refund. Individual refund dates live on each refund resource.
        paymentData:
          "$ref": "#/components/schemas/PaymentData"
      example:
        transactionId: '04058d70-7d15-4459-b046-d19b6f137c37'
        externalId: ORDER-1001
        status: started
        amount: '0.25'
        currency: USDT
        paymentMethod: crypto_payment
        description: Super Test
        creationDate: '2026-09-09T18:30:00Z'
        expirationDate: '2026-09-09T19:30:00Z'
        actionUrl: https://pay.sand.dinaria.com/checkout/cs_public_token
        customer:
          type: individual
          externalId: customer-123
          firstName: Sebastian
          lastName: Gonzalez
          email: sebastian@example.com
          country: UY
        metadata:
          orderId: ORDER-1001
        paymentData:
          type: redirect
          redirect:
            recommendedAlternative: universal
            links:
              universal: https://app.binance.com/qr/example
              app: bnc://app.binance.com/payment/example
              web: https://pay.binance.com/en/checkout/example
            qr:
              content: https://app.binance.com/qr/example
              imageUrl: https://public.example/qr.png
              expiresAt: '2026-09-09T19:30:00Z'
    PaymentStatus:
      type: string
      description: 'started: created and awaiting payer action; pending: provider processing; confirmed: provider confirmed funds; paid: funds are available for merchant settlement; cancelled/expired/failed: terminal unpaid outcomes; refunded: the confirmed payment has been fully refunded.'
      enum:
      - started
      - pending
      - confirmed
      - paid
      - cancelled
      - expired
      - failed
      - refunded
    DecimalAmount:
      type: string
      pattern: "^(0\\.[0-9]*[1-9][0-9]*|[1-9][0-9]*(\\.[0-9]+)?)$"
      description: Exact positive decimal represented as a string; never a floating-point JSON number.
    Customer:
      type: object
      additionalProperties: false
      required:
      - type
      - externalId
      - country
      properties:
        type:
          type: string
          enum:
          - individual
          - business
        externalId:
          type: string
          minLength: 1
        firstName:
          type: string
        lastName:
          type: string
        legalName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        state:
          type: string
        city:
          type: string
        address:
          type: string
        zipcode:
          type: string
        documentType:
          type: string
        documentNumber:
          type: string
        documentCountry:
          type: string
          pattern: "^[A-Z]{2}$"
