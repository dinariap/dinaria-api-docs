---
openapi: 3.1.0
info:
  title: Dinapay API
  version: 2.0.0
  description: Public API for creating and tracking incoming Payments, payment Refunds and outbound Payouts, persistent Customers and Virtual Accounts. Provider selection, routing and connector details are managed by Dinaria and remain transparent to API consumers.
servers:
- url: https://sbx.dinaria.com
  description: Sandbox
- url: https://payments.dinaria.com
  description: Production
tags:
- name: Payments
  description: Create and query incoming payments.
- name: Balances
  description: Query merchant-owned available balances.
- name: Refunds
  description: Create and query payment refunds.
- name: Sandbox
  description: Deterministic testing operations available only in Dinaria sandbox.
- name: Webhooks
  description: Manage V2 merchant webhook subscriptions.
- name: Payouts
  description: Create and query outbound transfers.
- name: Customers
  description: Manage persistent individuals and businesses owned by a merchant.
- name: Virtual Accounts
  description: Manage persistent receiving destinations owned by a customer.
webhooks:
  merchantEvent:
    post:
      operationId: receiveDinariaWebhookV2
      summary: Payment, refund, payout or virtual-account lifecycle event
      description: Signed at-least-once V2 delivery. Events may be duplicated or arrive out of order; deduplicate by eventId and retain the greatest resourceVersion. The registered webhook receives payment, refund, payout and virtual-account events through this same envelope.
      security: []
      parameters:
      - "$ref": "#/components/parameters/WebhookId"
      - "$ref": "#/components/parameters/WebhookTimestamp"
      - "$ref": "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/WebhookEvent"
      responses:
        '200':
          description: Event accepted
        '204':
          description: Event accepted without a response body
  payoutEvent:
    post:
      summary: Payout lifecycle event
      description: Dinaria sends payout.created after durable creation and payout.status_changed after a public status transition. Deliveries are at least once and may arrive out of order.
      parameters:
      - "$ref": "#/components/parameters/WebhookId"
      - "$ref": "#/components/parameters/WebhookTimestamp"
      - "$ref": "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PayoutWebhookEvent"
      responses:
        '200':
          description: Event acknowledged. Any HTTP 2xx response acknowledges delivery.
  virtualAccountEvent:
    post:
      summary: Virtual-account lifecycle event
      description: Signed at-least-once delivery. Deposits received by a virtual account use the ordinary payment.created and payment.status_changed events and include virtualAccountId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/VirtualAccountWebhookEvent"
      responses:
        '200':
          description: Acknowledged
paths:
  "/v2/balance":
    get:
      operationId: getMerchantBalanceV2
      summary: Retrieve merchant balances
      description: Returns the available balance owned by the selected merchant. Merchant-scoped credentials infer merchantId and must omit it. Account-scoped credentials must provide merchantId. The credential must grant balances:read; payments:read is accepted for compatibility with existing V2 keys.
      tags:
      - Balances
      parameters:
      - name: merchantId
        in: query
        required: false
        description: Required for account-scoped credentials and omitted for merchant-scoped credentials.
        schema:
          type: string
          minLength: 1
      - name: currency
        in: query
        required: false
        description: Optional ISO 4217 or supported digital-asset currency code. When omitted, all merchant currencies are returned.
        schema:
          type: string
          pattern: "^[A-Z]{3,8}$"
          examples:
          - ARS
      responses:
        '200':
          description: Merchant balances
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MerchantBalances"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/v2/payments":
    get:
      operationId: listPaymentsV2
      summary: List payments
      description: Returns payments visible to the authenticated principal in reverse chronological order. Use nextCursor to continue when hasMore is true.
      tags:
      - Payments
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Payments visible to the authenticated principal, ordered as one history
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PaymentPage"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
    post:
      operationId: createPaymentV2
      summary: Create a payment
      description: Creates a payment order and returns the customer action and payment-method-specific data needed to complete it.
      tags:
      - Payments
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreatePaymentRequest"
            examples:
              argentinaQr:
                summary: Argentina interoperable QR
                value:
                  externalId: ORDER-AR-QR-001
                  amount: '1000.00'
                  currency: ARS
                  paymentMethod: qr
                  rail: ar_qr
                  destinationMode: single_use
                  expirationDate: '2026-10-15T20:00:00Z'
                  customer: {type: individual, externalId: CUSTOMER-AR-001, firstName: Juan, lastName: Perez, country: AR}
              argentinaBankTransfer:
                summary: Argentina single-use bank transfer
                value:
                  externalId: ORDER-AR-BANK-001
                  amount: '1500.00'
                  currency: ARS
                  paymentMethod: bank_transfer
                  rail: ar_bank_transfer
                  destinationMode: single_use
                  customer: {type: individual, externalId: CUSTOMER-AR-002, firstName: Ana, lastName: Martinez, country: AR}
              mexicoSpeiSingleUse:
                summary: Mexico single-use SPEI collection
                value:
                  externalId: ORDER-MX-001
                  amount: '250.00'
                  currency: MXN
                  paymentMethod: bank_transfer
                  rail: spei
                  destinationMode: single_use
                  customer: {type: individual, externalId: CUSTOMER-MX-001, firstName: Juan, lastName: Perez, country: MX}
              mexicoSpeiReusable:
                summary: Mexico reusable SPEI collection
                value:
                  externalId: ORDER-MX-REUSABLE-001
                  amount: '250.00'
                  currency: MXN
                  paymentMethod: bank_transfer
                  rail: spei
                  destinationMode: reusable
                  collectionKey: CUSTOMER-MX-001
                  customer: {type: individual, externalId: CUSTOMER-MX-001, firstName: Juan, lastName: Perez, country: MX}
              chileBankTransfer:
                summary: Chile single-use bank transfer
                value:
                  externalId: ORDER-CL-001
                  amount: '10000'
                  currency: CLP
                  paymentMethod: bank_transfer
                  rail: cl_bank_transfer
                  destinationMode: single_use
                  expirationDate: '2026-10-15T20:00:00Z'
                  customer: {type: individual, externalId: CUSTOMER-CL-001, firstName: Juan, lastName: Perez, country: CL}
              peruQr:
                summary: Peru single-use QR
                value:
                  externalId: ORDER-PE-QR-001
                  amount: '100.00'
                  currency: PEN
                  paymentMethod: qr
                  rail: pe_qr
                  destinationMode: single_use
                  expirationDate: '2026-10-15T20:00:00-05:00'
                  customer: {type: individual, externalId: CUSTOMER-PE-001, firstName: Maria, lastName: Gomez, country: PE}
              peruBankTransfer:
                summary: Peru single-use bank transfer
                value:
                  externalId: ORDER-PE-BANK-002
                  amount: '150.00'
                  currency: PEN
                  paymentMethod: bank_transfer
                  rail: pe_bank_transfer
                  destinationMode: single_use
                  expirationDate: '2026-10-15T20:00:00-05:00'
                  customer: {type: individual, externalId: CUSTOMER-PE-002, firstName: Lucia, lastName: Torres, country: PE}
              ecuadorBankTransfer:
                summary: Ecuador single-use bank transfer
                value:
                  externalId: ORDER-EC-BANK-001
                  amount: '25.00'
                  currency: USD
                  paymentMethod: bank_transfer
                  rail: ec_bank_transfer
                  destinationMode: single_use
                  expirationDate: '2026-10-15T20:00:00-05:00'
                  customer: {type: individual, externalId: CUSTOMER-EC-001, firstName: Juan, lastName: Perez, email: juan.perez@example.com, country: EC, documentType: CC, documentNumber: '1712345678'}
      responses:
        '200':
          description: Idempotent replay of the original payment
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
                const: true
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Payment"
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Payment"
              examples:
                argentinaQr:
                  summary: Argentina QR payment created
                  value:
                    transactionId: 8dd5d1ee-1ba0-4311-bbbd-fd19765b2f93
                    externalId: ORDER-AR-QR-001
                    status: started
                    amount: '1000.00'
                    currency: ARS
                    paymentMethod: qr
                    creationDate: '2026-10-14T18:00:00Z'
                    expirationDate: '2026-10-15T20:00:00Z'
                    actionUrl: https://pay.dinaria.com/checkout/demo-order-ar-qr-001
                    paymentData:
                      type: qr
                      qr: {format: emv, qrCodeString: '000201010212...6304B081', qrCodeBase64: 'iVBORw0KGgoAAAANSUhEUgAA...', qrExpiresAt: '2026-10-15T20:00:00Z'}
                argentinaBankTransfer:
                  summary: Argentina bank-transfer payment created
                  value:
                    transactionId: 43e01b19-8ee2-43cb-9d38-150dc66e74c7
                    externalId: ORDER-AR-BANK-001
                    status: started
                    amount: '1500.00'
                    currency: ARS
                    paymentMethod: bank_transfer
                    creationDate: '2026-10-14T18:00:00Z'
                    actionUrl: https://pay.dinaria.com/checkout/demo-order-ar-bank-001
                    paymentData:
                      type: bank_transfer
                      bankTransfer:
                        rail: ar_bank_transfer
                        destinationMode: single_use
                        destination:
                          accountIdentifier: {type: cvu, value: '0000003100000000000001'}
                mexicoSpei:
                  summary: Mexico SPEI payment created
                  value:
                    transactionId: 77b891fc-f225-49b5-82d4-c19c739d26b0
                    externalId: ORDER-MX-001
                    status: started
                    amount: '250.00'
                    currency: MXN
                    paymentMethod: bank_transfer
                    creationDate: '2026-10-14T18:00:00Z'
                    actionUrl: https://pay.dinaria.com/checkout/demo-order-mx-001
                    paymentData:
                      type: bank_transfer
                      bankTransfer:
                        rail: spei
                        destinationMode: single_use
                        destination:
                          accountIdentifier: {type: clabe, value: '646180157034181180'}
                chileBankTransfer:
                  summary: Chile bank-transfer payment created
                  value:
                    transactionId: 59c8a946-4618-463f-b2d4-891d788acbbc
                    externalId: ORDER-CL-001
                    status: started
                    amount: '10000'
                    currency: CLP
                    paymentMethod: bank_transfer
                    creationDate: '2026-10-14T18:00:00Z'
                    actionUrl: https://pay.dinaria.com/checkout/demo-order-cl-001
                    paymentData:
                      type: bank_transfer
                      bankTransfer:
                        rail: cl_bank_transfer
                        destinationMode: single_use
                        destination:
                          accountIdentifier: {type: account_number, value: '1234567890'}
                          accountHolder: {name: Dinaria}
                        transferReference: PAY-59C8A946
                peruQr:
                  summary: Peru QR payment created
                  value:
                    transactionId: e46e7f83-713f-42d0-a3ae-b99bc5eb1c36
                    externalId: ORDER-PE-QR-001
                    status: started
                    amount: '100.00'
                    currency: PEN
                    paymentMethod: qr
                    creationDate: '2026-10-14T18:00:00Z'
                    expirationDate: '2026-10-16T01:00:00Z'
                    actionUrl: https://pay.dinaria.com/checkout/demo-order-pe-qr-001
                    paymentData:
                      type: qr
                      qr: {format: emv, qrCodeString: '000201010212...6304ABCD', qrCodeBase64: 'iVBORw0KGgoAAAANSUhEUgAA...', qrExpiresAt: '2026-10-16T01:00:00Z'}
                peruBankTransfer:
                  summary: Peru bank-transfer payment created
                  value:
                    transactionId: f31bfc91-acde-4f25-9e6b-bd4c5809b029
                    externalId: ORDER-PE-BANK-002
                    status: started
                    amount: '150.00'
                    currency: PEN
                    paymentMethod: bank_transfer
                    creationDate: '2026-10-14T18:00:00Z'
                    expirationDate: '2026-10-16T01:00:00Z'
                    actionUrl: https://pay.dinaria.com/checkout/demo-order-pe-bank-002
                    paymentData:
                      type: bank_transfer
                      bankTransfer:
                        rail: pe_bank_transfer
                        destinationMode: single_use
                        destination:
                          accountIdentifier: {type: cci, value: '00212345678901234567'}
                ecuadorBankTransfer:
                  summary: Ecuador bank-transfer payment created
                  value:
                    transactionId: 8b76207c-5317-4d20-ac65-90d14a6e64a3
                    externalId: ORDER-EC-BANK-001
                    status: started
                    amount: '25.00'
                    currency: USD
                    paymentMethod: bank_transfer
                    creationDate: '2026-10-14T18:00:00Z'
                    expirationDate: '2026-10-16T01:00:00Z'
                    actionUrl: https://pay.dinaria.com/checkout/demo-order-ec-bank-001
                    paymentData:
                      type: redirect
                      redirect:
                        recommendedAlternative: web
                        links: {web: "https://pay.dinaria.com/checkout/demo-order-ec-bank-001"}
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/Unprocessable"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/v2/payments/{transactionId}":
    get:
      operationId: getPaymentV2
      summary: Retrieve a payment
      description: Returns the latest public payment representation.
      tags:
      - Payments
      parameters:
      - "$ref": "#/components/parameters/TransactionId"
      responses:
        '200':
          description: Current payment representation
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Payment"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/v2/payments/{transactionId}/refunds":
    post:
      operationId: createPaymentRefundV2
      summary: Create a payment refund
      description: Creates a full or partial refund. A successful HTTP response means the refund was durably accepted; inspect its status for the final result.
      tags:
      - Refunds
      parameters:
      - "$ref": "#/components/parameters/TransactionId"
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateRefundRequest"
      responses:
        '200':
          description: Idempotent replay of the original refund
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
                const: true
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Refund"
        '201':
          description: Refund durably accepted; processing may still be pending
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Refund"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/Unprocessable"
        '503':
          "$ref": "#/components/responses/Unavailable"
    get:
      operationId: listPaymentRefundsV2
      summary: List payment refunds
      description: Returns all refund attempts associated with the payment.
      tags:
      - Refunds
      parameters:
      - "$ref": "#/components/parameters/TransactionId"
      responses:
        '200':
          description: Refunds for the payment
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RefundList"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/v2/refunds/{refundId}":
    get:
      operationId: getRefundV2
      summary: Retrieve a refund
      description: Returns the latest public refund representation.
      tags:
      - Refunds
      parameters:
      - "$ref": "#/components/parameters/RefundId"
      responses:
        '200':
          description: Current refund representation
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Refund"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/v2/sandbox/payments/{transactionId}/simulate":
    post:
      operationId: simulatePaymentV2
      summary: Simulate a sandbox payment observation
      description: Asks the sandbox connector selected for this payment to publish a normal provider observation. The resulting state transition, ledger effects and signed merchant webhooks use the regular V2 processing path. This endpoint is not mounted in production.
      tags:
      - Sandbox
      parameters:
      - "$ref": "#/components/parameters/TransactionId"
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SimulatePaymentRequest"
      responses:
        '202':
          description: Simulation durably accepted
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SimulationAccepted"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/Unprocessable"
        '503':
          "$ref": "#/components/responses/Unavailable"
  "/v2/webhooks":
    post:
      operationId: createWebhookV2
      summary: Create a V2 webhook subscription
      description: Registers one URL for the authenticated account or merchant. Omitting eventTypes subscribes to every current and future V2 event. The secret is returned only in this response and after rotation.
      tags:
      - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateWebhookSubscription"
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WebhookSubscriptionWithSecret"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
    get:
      operationId: listWebhooksV2
      summary: List V2 webhook subscriptions
      tags:
      - Webhooks
      responses:
        '200':
          description: Subscriptions visible to the authenticated scope
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/WebhookSubscription"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/v2/webhooks/{webhookId}":
    parameters:
    - "$ref": "#/components/parameters/WebhookSubscriptionId"
    patch:
      operationId: updateWebhookV2
      summary: Update a V2 webhook subscription
      tags:
      - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateWebhookSubscription"
      responses:
        '200':
          description: Subscription updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WebhookSubscription"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
    delete:
      operationId: deleteWebhookV2
      summary: Delete a V2 webhook subscription
      tags:
      - Webhooks
      responses:
        '204':
          description: Subscription deleted
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/v2/webhooks/{webhookId}/rotate-secret":
    post:
      operationId: rotateWebhookSecretV2
      summary: Rotate a V2 webhook secret
      tags:
      - Webhooks
      parameters:
      - "$ref": "#/components/parameters/WebhookSubscriptionId"
      responses:
        '200':
          description: Secret rotated; the previous secret remains valid for 24 hours
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WebhookSubscriptionWithSecret"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/v2/payouts":
    post:
      operationId: createPayoutV2
      summary: Create a payout
      description: Durably accepts an outbound transfer for asynchronous processing. Idempotency-Key identifies the technical request; externalId identifies the payout in the client's system.
      tags:
      - Payouts
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreatePayout"
            examples:
              argentinaBankTransfer:
                summary: Argentina bank payout using a CBU
                value:
                  externalId: PAYOUT-AR-1001
                  source:
                    amount: '15000'
                    currency: ARS
                  destination:
                    country: AR
                    currency: ARS
                    beneficiary:
                      type: individual
                      name: Maria Gonzalez
                    rail:
                      type: ar_bank_transfer
                      accountType: cbu
                      accountNumber: '0000003100012345678901'
                  description: Supplier payment
              venezuelaMobilePayment:
                summary: Venezuela mobile payment remittance
                value:
                  externalId: PAYOUT-VE-MOBILE-1001
                  source:
                    amount: '10.00'
                    currency: USDT
                  destination:
                    country: VE
                    currency: VES
                    beneficiary:
                      type: individual
                      name: Maria Gonzalez
                      documentType: RIF
                      documentNumber: V27127416
                      mobile: "+584242005748"
                      address: Caracas, Venezuela
                      email: maria@example.com
                    rail:
                      type: ve_mobile_payment
                      bankCode: '0102'
                  remitter:
                    type: individual
                    documentType: DNI
                    documentNumber: '30123456'
                    firstName: Juan
                    lastName: Perez
                    birthDate: '1985-06-15'
                    nationality: ARG
                    mobile: "+5491112345678"
                    address: Buenos Aires, Argentina
                    email: juan@example.com
                  description: Payment to beneficiary
                  metadata:
                    customerId: customer-456
              venezuelaBankAccount:
                summary: Venezuela bank account remittance
                value:
                  externalId: PAYOUT-VE-BANK-1001
                  source:
                    amount: '25.00'
                    currency: USDT
                  destination:
                    country: VE
                    currency: VES
                    beneficiary:
                      type: individual
                      name: Maria Gonzalez
                      documentType: RIF
                      documentNumber: V40001469
                      mobile: "+584242005748"
                      address: Caracas, Venezuela
