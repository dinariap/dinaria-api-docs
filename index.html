<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>

  <link rel="icon" type="image/x-icon" href="assets/favicon.ico"/>

</head>
<body>

  <!-- Overlay for mobile sidebar -->
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a class="logo" href="#" onclick="goHome(); return false;">

      </a>

    <nav class="nav-tree" id="nav-tree"></nav>

  <!-- Main -->

      <button class="menu-btn" onclick="toggleSidebar()">&#9776;</button>

        <button class="country-btn" id="cbtn-ar" onclick="selectCountry('ar')">🇦🇷 Argentina</button>
        <button class="country-btn" id="cbtn-mx" onclick="selectCountry('mx')">🇲🇽 México</button>

        <button class="country-btn" id="cbtn-ve" onclick="selectCountry('ve')">🇻🇪 Venezuela</button>
        <button class="country-btn" id="cbtn-pe" onclick="selectCountry('pe')">🇵🇪 Perú</button>
        <button class="country-btn" id="cbtn-ec" onclick="selectCountry('ec')">🇪🇨 Ecuador</button>
      </div>
    </header>
    <main class="content" id="content">
      <div class="content-inner" id="content-inner">
